[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontolens"
version = "0.1.0"
description = "Generate static HTML ontology documentation from RDF/OWL files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13",
    "Jinja2>=3.1",
    "Markdown>=3.7",
    "PyYAML>=6.0",
    "rdflib>=7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pypdf>=5.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.34", "ruamel.yaml>=0.18"]
pdf = ["playwright>=1.49"]

[project.scripts]
ontolens = "ontolens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontolens"]
